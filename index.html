<title>Patch-at</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* ==========================================
   LOGIN
   ========================================== */

.auth-page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.auth-card {

  width: 100%;

  max-width: 430px;

  background: white;

  border-radius: 20px;

  padding: 28px;

  box-shadow: 0 5px 25px #0002;

}

.logo {

  text-align: center;

  margin-bottom: 25px;

}

.logo h1 {

  margin: 0;

  color: #2563eb;

}

.logo p {

  color: #64748b;

}

input,
select {

  width: 100%;

  padding: 13px;

  border: 1px solid #cbd5e1;

  border-radius: 10px;

  margin: 6px 0;

  background: white;

}

button {

  width: 100%;

  padding: 13px;

  border: 0;

  border-radius: 10px;

  background: #2563eb;

  color: white;

  margin: 6px 0;

}

button.secondary {

  background: #e2e8f0;

  color: #172033;

}

button.danger {

  background: #dc2626;

}

button.small-btn {

  width: auto;

  padding: 8px 12px;

}

.status {

  margin-top: 12px;

  padding: 10px;

  border-radius: 8px;

  background: #f1f5f9;

  font-size: 14px;

  overflow-wrap: anywhere;

}


/* ==========================================
   APP
   ========================================== */

.app {

  min-height: 100vh;

}

.topbar {

  height: 65px;

  background: white;

  border-bottom: 1px solid #e2e8f0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 8px 18px;

  position: sticky;

  top: 0;

  z-index: 10;

}

.my-profile {

  display: flex;

  align-items: center;

  gap: 10px;

}

.avatar {

  width: 42px;

  height: 42px;

  border-radius: 50%;

  background: #2563eb;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

}

.profile-text strong {

  display: block;

}

.profile-text span {

  font-size: 12px;

  color: #64748b;

}

.top-actions {

  display: flex;

  align-items: center;

  gap: 8px;

}

.gear {

  width: 42px;

  height: 42px;

  border-radius: 50%;

  padding: 0;

  margin: 0;

  background: #f1f5f9;

  color: #172033;

  font-size: 21px;

}

.gear.notification-enabled {

  background: #dcfce7;

  color: #15803d;

}

.gear.notification-disabled {

  background: #fee2e2;

  color: #dc2626;

}


/* ==========================================
   LAYOUT
   ========================================== */

.layout {

  max-width: 1100px;

  margin: auto;

  display: grid;

  grid-template-columns: 320px 1fr;

  min-height: calc(100vh - 65px);

}

.sidebar {

  background: white;

  border-right: 1px solid #e2e8f0;

  padding: 15px;

}

.sidebar h3 {

  margin-top: 5px;

}

.member {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 11px;

  border-radius: 12px;

  cursor: pointer;

}

.member:hover {

  background: #f1f5f9;

}

.member-avatar {

  width: 42px;

  height: 42px;

  border-radius: 50%;

  background: #2563eb;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

  flex-shrink: 0;

}

.member-info {

  min-width: 0;

  flex: 1;

}

.member-info strong {

  display: block;

  overflow: hidden;

  text-overflow: ellipsis;

}

.member-info span {

  font-size: 12px;

  color: #64748b;

}

.online-dot {

  width: 10px;

  height: 10px;

  background: #22c55e;

  border-radius: 50%;

}

.offline-dot {

  width: 10px;

  height: 10px;

  background: #ef4444;

  border-radius: 50%;

}


/* ==========================================
   CHAT
   ========================================== */

.chat {

  display: flex;

  flex-direction: column;

  min-width: 0;

}

.chat-header {

  background: white;

  padding: 15px 18px;

  border-bottom: 1px solid #e2e8f0;

}

.chat-header strong {

  display: block;

}

.chat-header span {

  font-size: 13px;

  color: #64748b;

}

.messages {

  flex: 1;

  padding: 18px;

  overflow-y: auto;

  min-height: 400px;

}

.message {

  max-width: 75%;

  margin: 8px 0;

  padding: 10px 13px;

  border-radius: 14px;

  background: white;

  box-shadow: 0 1px 4px #0001;

  overflow-wrap: anywhere;

}

.message.me {

  margin-left: auto;

  background: #2563eb;

  color: white;

}

.message-name {

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 3px;

}

.message-time {

  font-size: 10px;

  opacity: .65;

  margin-top: 4px;

}

.send-area {

  background: white;

  border-top: 1px solid #e2e8f0;

  padding: 10px;

  display: flex;

  gap: 8px;

}

.send-area input {

  margin: 0;

}

.send-area button {

  width: 90px;

  margin: 0;

/* ==========================================
   SETTINGS
   ========================================== */

.settings {

  position: fixed;

  top: 65px;

  right: 15px;

  width: 280px;

  background: white;

  border-radius: 15px;

  box-shadow: 0 5px 25px #0003;

  padding: 15px;

  z-index: 20;

.settings button {

/* ==========================================
   PROFILE

.profile-card {

  padding: 22px;

  border-radius: 18px;

  box-shadow: 0 4px 20px #0001;

.back-btn {

  color: #172033;

/* ==========================================
   NOTIFICATION STATUS
   ========================================== */

.notification-box {

  margin-top: 15px;

  padding: 14px;

  border-radius: 12px;

  background: #eff6ff;

  color: #1e40af;

  font-size: 14px;

  line-height: 1.5;

}


/* ==========================================
   TOAST
   ========================================== */

.toast {

  position: fixed;

  left: 50%;

  bottom: 25px;

  transform: translateX(-50%);

  background: #172033;

  color: white;

  padding: 13px 18px;

  border-radius: 12px;

  box-shadow: 0 5px 20px #0004;

  z-index: 9999;

  max-width: 90%;

  text-align: center;

  display: none;

}

.toast.show {

  display: block;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 700px) {

  .layout {

    display: block;

  }

  .sidebar {

    border-right: 0;

    border-bottom: 1px solid #e2e8f0;

  }

  .message {

    max-width: 88%;

  }

  .topbar {

    padding: 8px 10px;

  }

  .top-actions {

    gap: 5px;

  }

function getInitial(name) {

function formatThaiTime(timestamp) {

  if (
    !timestamp ||
    typeof timestamp.toDate !==
      "function"
  ) {

    return "กำลังบันทึกเวลา...";

  }


  return new Intl.DateTimeFormat(
    "th-TH",
    {

      hour: "2-digit",

      minute: "2-digit",

      hour12: false,

      timeZone:
        "Asia/Bangkok"

    }

  ).format(
    timestamp.toDate()
  ) + " น.";

}

/* ==========================================
   SERVICE WORKER
   ========================================== */

async function registerMessagingServiceWorker() {

  if (
    !("serviceWorker" in navigator)
  ) {

    console.warn(
      "Browser ไม่รองรับ Service Worker"
    );

    return null;

  }


  try {

    messagingRegistration =
      await navigator
        .serviceWorker
        .register(
          "./firebase-messaging-sw.js"
        );


    console.log(
      "Firebase Messaging Service Worker พร้อมใช้งาน"
    );


    return messagingRegistration;


  } catch (error) {

    console.error(
      "ลงทะเบียน Service Worker ไม่สำเร็จ:",
      error
    );


    return null;

  }

}



/* ==========================================
   NOTIFICATION STATUS
   ========================================== */

function updateNotificationUI() {

  const permission =
    Notification.permission;


  const button =
    $("notifyBtn");


  const profileButton =
    $("profileNotifyBtn");


  const status =
    $("notificationStatus");


  if (
    permission ===
    "granted"
  ) {

    button.classList.add(
      "notification-enabled"
    );

    button.classList.remove(
      "notification-disabled"
    );

    button.title =
      "การแจ้งเตือนเปิดอยู่";


    profileButton.textContent =
      "🔔 การแจ้งเตือนเปิดอยู่";


    status.textContent =
      "เปิดการแจ้งเตือนแล้ว";


  } else {

    button.classList.remove(
      "notification-enabled"
    );


    if (
      permission ===
      "denied"
    ) {

      button.classList.add(
        "notification-disabled"
      );

      button.title =
        "การแจ้งเตือนถูกปิด";

      status.textContent =
        "การแจ้งเตือนถูกปิดในเบราว์เซอร์";

    } else {

      button.title =
        "เปิดการแจ้งเตือน";

      status.textContent =
        "ยังไม่ได้เปิดการแจ้งเตือน";

    }


    profileButton.textContent =
      "🔔 เปิดการแจ้งเตือน";

  }

}

async function enableNotifications() {

  if (!currentUser) {

    alert(
      "กรุณาเข้าสู่ระบบก่อน"
    );

    return;

  }


  if (
    !("Notification" in window)
  ) {

    alert(
      "อุปกรณ์นี้ไม่รองรับการแจ้งเตือน"
    );

    return;

  }


  if (
    !("serviceWorker" in navigator)
  ) {

    alert(
      "เบราว์เซอร์นี้ไม่รองรับ Service Worker"
    );

    return;

  }


  if (
    !VAPID_KEY ||
    VAPID_KEY.includes(
      "BLtTsQbqqwp2Rw-be-tOLQrnGCSBfBltndQNoLVb7MJN67imb7XGNdNskHg_PzgyrLA-xEeaLN0ua2bgEkhlB9Q"
    )
  ) {

    alert(
      "ยังไม่ได้ใส่ VAPID Key จาก Firebase"
    );

    return;

  }


  try {


    const permission =
      await Notification
        .requestPermission();


    if (
      permission !==
      "granted"
    ) {

      updateNotificationUI();

      alert(
        "คุณไม่ได้อนุญาตการแจ้งเตือน"
      );

      return;

    }


    const registration =
      await registerMessagingServiceWorker();


    if (!registration) {

      alert(
        "ไม่สามารถเปิดระบบแจ้งเตือนได้"
      );

      return;

    }


    const token =
      await messaging.getToken({

        vapidKey:
          VAPID_KEY,

        serviceWorkerRegistration:
          registration

      });


    if (!token) {

      alert(
        "ไม่สามารถสร้าง Notification Token ได้"
      );

      return;

    }


    notificationToken =
      token;


    await db
      .collection("profiles")
      .doc(currentUser.uid)
      .set({

        notificationToken:
          token,

        notificationsEnabled:
          true,

        notificationUpdatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      }, {

        merge: true

      });


    updateNotificationUI();


    showToast(
      "เปิดการแจ้งเตือนสำเร็จแล้ว 🔔"
    );


    console.log(
      "FCM Token:",
      token
    );


  } catch (error) {

    console.error(
      "เปิดการแจ้งเตือนไม่สำเร็จ:",
      error
    );


    alert(
      "เปิดการแจ้งเตือนไม่สำเร็จ: " +
      error.message
    );

  }

}

/* ==========================================
   PROFILE
   ========================================== */

async function loadMyProfile() {

  const ref =
    db
      .collection("profiles")
      .doc(
        currentUser.uid
      );


  const snap =
    await ref.get();


  if (!snap.exists) {

    openProfilePage();

    return;

  }


  currentProfile =
    snap.data();


  updateMyHeader();


  if (
    currentProfile
      .notificationsEnabled
  ) {

    updateNotificationUI();

  }

}



function updateMyHeader() {

  const name =
    currentProfile?.name ||
    "สมาชิก";


  $("myName")
    .textContent =
    name;


  $("myAvatar")
    .textContent =
    getInitial(name);

}



function openProfilePage() {

  $("app")
    .classList.add(
      "hidden"
    );


  $("profilePage")
    .classList.remove(
      "hidden"
    );


  if (currentProfile) {

    $("profileName")
      .value =
      currentProfile.name ||
      "";


    $("profileAge")
      .value =
      currentProfile.age ||
      "";


    $("profileGender")
      .value =
      currentProfile.gender ||
      "";


    $("profileProvince")
      .value =
      currentProfile.province ||
      "";

  }


  updateNotificationUI();

}

$("saveProfileBtn")
  .onclick =
  async () => {

    const name =
      $("profileName")
        .value
        .trim();


    const age =
      Number(
        $("profileAge").value
      );


    const gender =
      $("profileGender")
        .value;


    const province =
      $("profileProvince")
        .value;


    if (!name) {

      $("profileStatus")
        .textContent =
        "กรุณากรอกชื่อ";

      return;

    }


    if (
      !age ||
      age < 1 ||
      age > 120
    ) {

      $("profileStatus")
        .textContent =
        "กรุณากรอกอายุให้ถูกต้อง";

      return;

    }


    if (!gender) {

      $("profileStatus")
        .textContent =
        "กรุณาเลือกเพศ";

      return;

    }


    if (!province) {

      $("profileStatus")
        .textContent =
        "กรุณาเลือกจังหวัด";

      return;

    }


    try {

      const ref =
        db
          .collection("profiles")
          .doc(
            currentUser.uid
          );


      const old =
        await ref.get();


      const data = {

        name,

        age,

        gender,

        province,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };


      if (!old.exists) {

        data.createdAt =
          firebase.firestore
            .FieldValue
            .serverTimestamp();

      }


      await ref.set(
        data,
        {
          merge: true
        }
      );


      currentProfile = {

        ...(currentProfile || {}),

        ...data,

        name,

        age,

        gender,

        province

      };


      updateMyHeader();


      $("profileStatus")
        .textContent =
        "บันทึกข้อมูลสำเร็จ";


      setTimeout(() => {

        $("profilePage")
          .classList.add(
            "hidden"
          );


        $("app")
          .classList.remove(
            "hidden"
          );


        loadMembers();

      }, 700);


    } catch (error) {

      $("profileStatus")
        .textContent =
        "บันทึกไม่สำเร็จ: " +
        error.message;

    }

  };



/* ==========================================
   MEMBERS
   ========================================== */

async function loadMembers() {

  if (unsubscribeMembers) {

    unsubscribeMembers();

  }


  unsubscribeMembers =
    db
      .collection("profiles")
      .onSnapshot(
        snapshot => {


          const search =
            $("searchMember")
              .value
              .trim()
              .toLowerCase();


          $("memberList")
            .replaceChildren();


          snapshot.forEach(
            doc => {


              const data =
                doc.data();


              if (
                doc.id ===
                currentUser.uid
              ) {

                return;

              }


              const name =
                data.name ||
                "สมาชิก";


              if (
                search &&
                !name
                  .toLowerCase()
                  .includes(search)
              ) {

                return;

              }


              const item =
                document.createElement(
                  "div"
                );


              item.className =
                "member";


              const avatar =
                document.createElement(
                  "div"
                );


              avatar.className =
                "member-avatar";


              avatar.textContent =
                getInitial(name);


              const info =
                document.createElement(
                  "div"
                );


              info.className =
                "member-info";


              const strong =
                document.createElement(
                  "strong"
                );


              strong.textContent =
                name;


              const span =
                document.createElement(
                  "span"
                );


              span.textContent =
                data.province ||
                "";


              info.append(
                strong,
                span
              );


              const dot =
                document.createElement(
                  "div"
                );


              dot.className =
                "offline-dot";


              item.append(
                avatar,
                info,
                dot
              );


              item.onclick = () => {

                openPrivateChat(
                  doc.id,
                  name
                );

              };


              $("memberList")
                .appendChild(item);

            }
          );


          if (
            !$("memberList")
              .children.length
          ) {

            $("memberList")
              .textContent =
              "ยังไม่มีสมาชิกคนอื่น";

          }

        },

        error => {

          console.error(
            error
          );

        }
      );

}



$("searchMember")
  .oninput = () => {

    loadMembers();

  };



/* ==========================================
   PRIVATE CHAT
   ========================================== */

function makeRoomId(
  uid1,
  uid2
) {

  return [
    uid1,
    uid2
  ]
    .sort()
    .join("_");

}



async function openPrivateChat(
  friendUid,
  friendName
) {

  if (!currentUser) {

    return;

  }


  currentFriend = {

    uid:
      friendUid,

    name:
      friendName

  };


  currentRoom =
    makeRoomId(
      currentUser.uid,
      friendUid
    );


  $("chatTitle")
    .textContent =
    friendName;


  $("chatSubtitle")
    .textContent =
    "แชทส่วนตัว";


  $("messageInput")
    .disabled =
    false;


  $("sendBtn")
    .disabled =
    false;


  const roomRef =
    db
      .collection("rooms")
      .doc(
        currentRoom
      );


  const roomSnap =
    await roomRef.get();


  if (!roomSnap.exists) {

    await roomRef.set({

      members: [

        currentUser.uid,

        friendUid

      ].sort(),

      createdAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    });

  }


  listenMessages();

}



/* ==========================================
   REALTIME MESSAGES
   ========================================== */

function listenMessages() {

  if (unsubscribeMessages) {

    unsubscribeMessages();

  }


  $("messages")
    .replaceChildren();


  const roomId =
    currentRoom;


  unsubscribeMessages =
    db
      .collection("rooms")
      .doc(roomId)
      .collection("messages")
      .orderBy("createdAt")
      .limit(100)
      .onSnapshot(
        snapshot => {


          if (
            currentRoom !==
            roomId
          ) {

            return;

          }


          $("messages")
            .replaceChildren();


          snapshot.forEach(
            doc => {


              const data =
                doc.data();


              const message =
                document.createElement(
                  "div"
                );


              message.className =
                "message";


              const isMine =
                data.senderId ===
                currentUser.uid;


              if (isMine) {

                message.classList.add(
                  "me"
                );

              }


              const name =
                document.createElement(
                  "div"
                );


              name.className =
                "message-name";


              name.textContent =
                isMine
                  ? "คุณ"
                  : currentFriend?.name ||
                    "เพื่อน";


              const text =
                document.createElement(
                  "div"
                );


              text.textContent =
                data.text ||
                "";


              const time =
                document.createElement(
                  "div"
                );


              time.className =
                "message-time";


              time.textContent =
                formatThaiTime(
                  data.createdAt
                );


              message.append(
                name,
                text,
                time
              );


              $("messages")
                .appendChild(
                  message
                );

            }
          );


          $("messages")
            .scrollTop =
            $("messages")
              .scrollHeight;

        },

        error => {

          console.error(
            "โหลดข้อความไม่สำเร็จ",
            error
          );

        }
      );

}




/* ==========================================
   SEND MESSAGE
   ========================================== */

$("sendForm").onsubmit = async event => {
  event.preventDefault();

  const text = $("messageInput").value.trim();

  if (
    !currentUser ||
    !currentRoom ||
    !currentFriend ||
    !text
  ) {
    return;
  }

  try {
    await db
      .collection("rooms")
      .doc(currentRoom)
      .collection("messages")
      .add({
        senderId: currentUser.uid,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

    $("messageInput").value = "";

  } catch (error) {
    console.error("ส่งข้อความไม่สำเร็จ:", error);

    alert(
      "ส่งข้อความไม่สำเร็จ: " +
      error.message
    );
  }
};
