
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patch-at | ห้องแชท</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f1f5f9; color: #172033;
    }
    .wrap { max-width: 480px; margin: 40px auto; padding: 16px; }
    .card {
      background: white; border-radius: 18px; padding: 24px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { text-align: center; color: #2563eb; }
    input, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button { border: 0; background: #2563eb; color: white; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #172033; }
    #status { overflow-wrap: anywhere; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Patch-at</h1>
      <p style="text-align:center">ห้องแชทของคุณ</p>

      <div id="auth">
        <input id="email" type="email" placeholder="อีเมล" autocomplete="email">
        <input id="password" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" autocomplete="current-password">
        <button id="signup">สมัครสมาชิก</button>
        <button id="login">เข้าสู่ระบบ</button>
        <button id="reset" class="secondary">ลืมรหัสผ่าน</button>
      </div>

      <div id="account" class="hidden">
        <p>เข้าสู่ระบบแล้ว: <strong id="who"></strong></p>
        <button id="logout" class="secondary">ออกจากระบบ</button>
      </div>
      <p id="status" role="status">กำลังเตรียมระบบ...</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      sendPasswordResetEmail, onAuthStateChanged, signOut,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // นำค่า Config จริงจาก Firebase มาใส่ในส่วนนี้
    const firebaseConfig = {
      apiKey: "AIzaSyAdEhQTgHQtCaat5dPKBAizgNYpoxm4dco",
      authDomain: "patch-at.firebaseapp.com",
      projectId: "patch-at",
      appId: "1:201035067162:web:021d18b8f574bcbe8cc6a3"
    };

    const status = (message) => {
      document.getElementById("status").textContent = message;
    };
    const value = (id) => document.getElementById(id).value.trim();

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      await setPersistence(auth, browserLocalPersistence);

      onAuthStateChanged(auth, (user) => {
        document.getElementById("auth").classList.toggle("hidden", !!user);
        document.getElementById("account").classList.toggle("hidden", !user);
        document.getElementById("who").textContent = user?.email || "";
        if (user) status("เข้าสู่ระบบแล้ว");
        else status("กรุณาสมัครสมาชิกหรือเข้าสู่ระบบ");
      });

      document.getElementById("signup").onclick = async () => {
        const email = value("email");
        const password = document.getElementById("password").value;
        if (!email || !password) return status("กรุณากรอกอีเมลและรหัสผ่าน");
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          status("สมัครสมาชิกสำเร็จ");
        } catch (e) { status("เกิดข้อผิดพลาด: " + e.message); }
      };

      document.getElementById("login").onclick = async () => {
        const email = value("email");
        const password = document.getElementById("password").value;
        if (!email || !password) return status("กรุณากรอกอีเมลและรหัสผ่าน");
        try {
          await signInWithEmailAndPassword(auth, email, password);
          status("เข้าสู่ระบบสำเร็จ");
        } catch (e) { status("เกิดข้อผิดพลาด: " + e.message); }
      };

      document.getElementById("reset").onclick = async () => {
        const email = value("email");
        if (!email) return status("กรุณากรอกอีเมลก่อนขอรีเซ็ตรหัสผ่าน");
        try {
          await sendPasswordResetEmail(auth, email);
          status("ส่งลิงก์ตั้งรหัสผ่านใหม่แล้ว กรุณาตรวจอีเมล");
        } catch (e) { status("เกิดข้อผิดพลาด: " + e.message); }
      };

      document.getElementById("logout").onclick = async () => {
        try {
          await signOut(auth);
          status("ออกจากระบบแล้ว");
        } catch (e) { status("เกิดข้อผิดพลาด: " + e.message); }
      };
    } catch (e) {
      status("ตั้งค่า Firebase ไม่สำเร็จ: " + e.message);
    }
  </script>
</body>
</html>
