<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอพแชท</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f0f2f5;color:#1c1e21}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit}
[hidden]{display:none!important}
.card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 4px 20px #0002}
.card h2{text-align:center;margin-bottom:14px}
.fld{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;background:#fff}
.go{background:#1877f2;color:#fff;width:100%;padding:12px;border-radius:10px;font-weight:700;margin-top:8px}
.alt{background:#e7f0ff;color:#1877f2;width:100%;padding:12px;border-radius:10px;font-weight:700;margin-top:8px}
.sm{background:none;color:#1877f2;font-size:14px;padding:4px 6px}
.msg{font-size:13px;margin-top:10px;text-align:center;color:#d33}
.msg.ok{color:#1a8f3c}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:#f0f2f5;z-index:40}
#app{height:100%;display:flex;flex-direction:column}
#top{background:#1877f2;color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:relative;z-index:30}
#top .nm{font-weight:700;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gear{background:#fff3;color:#fff;border-radius:50%;width:34px;height:34px;font-size:18px}
#menu{position:absolute;top:100%;left:10px;background:#fff;color:#222;border-radius:12px;box-shadow:0 6px 24px #0004;min-width:210px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;padding:13px 16px;background:#fff;font-size:15px}
#menu button:hover{background:#f0f2f5}
#menu .out{color:#d33}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:#aab}
.sec{padding:14px 14px 6px;font-size:13px;color:#777;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0;cursor:pointer}
.item:active{background:#e7f0ff}
.dot{width:9px;height:9px;border-radius:50%;background:#31c453;margin-left:auto}
.sub{font-size:12px;color:#888}
#home{flex:1;overflow-y:auto}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{background:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd}
#ch b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ch button{background:#e4e6eb;border-radius:8px;padding:6px 10px;font-size:16px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:8px;max-width:85%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.b{background:#fff;border-radius:14px;padding:7px 11px;word-break:break-word;box-shadow:0 1px 1px #0001}
.m.me .b{background:#d9eaff}
.n{font-size:11px;color:#777;margin-bottom:2px}
.pic{max-width:min(240px,60vw);border-radius:10px;display:block;margin-top:4px}
#typing{height:20px;padding:0 14px;font-size:12px;color:#777}
#bar{display:flex;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fff;align-items:center}
#bar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;outline:0}
.ic{background:#e4e6eb;border-radius:50%;width:40px;height:40px;font-size:18px}
#send{background:#1877f2;color:#fff;border-radius:20px;padding:10px 16px}
#ov{position:fixed;inset:0;background:#0007;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#md{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto}
#md h3{margin-bottom:10px}
#md .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
#md .row .grow{flex:1;min-width:0}
.pv{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:#ccd}
.tag{background:#ffe8a3;color:#7a5a00;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px}
.mini{background:#1877f2;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.mini.red{background:#e44}
</style>
</head>
<body>

<!-- ===== หน้าแรก: เข้าสู่ระบบ / สมัคร / ลืมรหัสผ่าน ===== -->
<div id="auth" hidden>
  <div class="card">
    <h2 id="aTitle">💬 เข้าสู่ระบบ</h2>
    <div id="regBox" hidden>
      <input class="fld" id="rName" maxlength="30" placeholder="ชื่อที่แสดง">
      <select class="fld" id="rProv"></select>
    </div>
    <input class="fld" id="aEmail" type="email" placeholder="อีเมล" autocomplete="email">
    <input class="fld" id="aPass" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button class="go" id="aGo">เข้าสู่ระบบ</button>
    <button class="alt" id="aReg">สมัครสมาชิก</button>
    <div style="text-align:center;margin-top:6px"><button class="sm" id="aForgot">ลืมรหัสผ่าน?</button></div>
    <div class="msg" id="aMsg"></div>
  </div>
</div>

<!-- ===== แอพหลัก ===== -->
<div id="app" hidden>
  <div id="top">
    <div id="tAv"></div>
    <div class="nm" id="tName"></div>
    <button id="gear" title="ตั้งค่า">⚙️</button>
    <div id="menu" hidden>
      <button id="mProfile">👤 บัญชีผู้ใช้</button>
      <button id="mSettings">🔑 ตั้งค่าบัญชีผู้ใช้</button>
      <button id="mOut" class="out">🚪 ออกจากระบบ</button>
    </div>
  </div>

  <div id="home">
    <div class="sec">กลุ่มของฉัน <button class="sm" id="newGroup">+ สร้างกลุ่ม</button></div>
    <div id="groups"></div>
    <div class="sec">สมาชิกทั้งหมด (แตะเพื่อแชทส่วนตัว)</div>
    <div id="users"></div>
  </div>

  <div id="chat" hidden>
    <div id="ch"><button id="back">←</button><b id="cTitle"></b><button id="info" hidden>👥</button></div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div id="bar">
      <button class="ic" id="imgBtn">🖼️</button>
      <input id="text" type="text" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button id="send">ส่ง</button>
    </div>
  </div>
</div>

<div id="ov" hidden><div id="md"></div></div>
<input type="file" id="file" accept="image/*" hidden>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential,
  setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query,
  orderBy, limit, limitToLast, where, serverTimestamp, arrayUnion, arrayRemove }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ========= 1) วาง firebaseConfig ของคุณตรงนี้ ========= */
const firebaseConfig = {
  apiKey: "ใส่ของคุณ",
  authDomain: "ใส่ของคุณ",
  projectId: "ใส่ของคุณ",
  storageBucket: "ใส่ของคุณ",
  messagingSenderId: "ใส่ของคุณ",
  appId: "ใส่ของคุณ"
};
/* ===================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];
const ERR = {
  "auth/email-already-in-use": "อีเมลนี้สมัครไปแล้ว (1 อีเมลต่อ 1 บัญชี)",
  "auth/invalid-email": "รูปแบบอีเมลไม่ถูกต้อง",
  "auth/weak-password": "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
  "auth/invalid-credential": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
  "auth/user-not-found": "ไม่พบอีเมลนี้",
  "auth/wrong-password": "รหัสผ่านไม่ถูกต้อง",
  "auth/missing-password": "กรุณากรอกรหัสผ่าน",
  "auth/too-many-requests": "ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่",
  "auth/network-request-failed": "อินเทอร์เน็ตมีปัญหา",
  "auth/operation-not-allowed": "ยังไม่ได้เปิด Email/Password ใน Firebase Authentication"
};
const errText = e => ERR[e.code] || ("เกิดข้อผิดพลาด: " + (e.code || e.message));

let uid = null, me = {}, usersMap = {}, groupsMap = {}, cur = null;
let unsubMsgs = null, unsubTyping = null, typingCache = [], lastTyping = 0, pendingProfile = null;
let fileMode = "chat", pickedPhoto = null;

/* ---------- helpers ---------- */
function provOptions(sel, val) {
  sel.innerHTML = '<option value="">-- เลือกจังหวัด --</option>' + PROVINCES.map(p => `<option>${p}</option>`).join("");
  sel.value = val || "";
}
function avatar(photo, name, size) {
  let el;
  if (photo) { el = document.createElement("img"); el.src = photo; el.className = "av"; }
  else {
    el = document.createElement("div"); el.className = "av"; el.textContent = (name || "?")[0];
    el.style.background = "hsl(" + ([...(name || "?")].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360) + ",55%,55%)";
  }
  if (size) { el.style.width = el.style.height = size + "px"; }
  return el;
}
function resize(file, max, q = 0.7) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
const dmId = (a, b) => [a, b].sort().join("_");
function openModal(html) { $("md").innerHTML = html; $("ov").hidden = false; return $("md"); }
function closeModal() { $("ov").hidden = true; $("md").innerHTML = ""; }
$("ov").onclick = e => { if (e.target === $("ov")) closeModal(); };

/* ================= หน้าเข้าสู่ระบบ ================= */
await setPersistence(auth, browserLocalPersistence).catch(() => {}); // อยู่ในระบบตลอดจนกว่าจะกดออก
provOptions($("rProv"));
let mode = "login";
function setMode(m) {
  mode = m; $("aMsg").textContent = ""; $("aMsg").className = "msg";
  $("regBox").hidden = m !== "register";
  $("aPass").hidden = m === "forgot";
  $("aTitle").textContent = m === "register" ? "📝 สมัครสมาชิก" : m === "forgot" ? "🔑 ลืมรหัสผ่าน" : "💬 เข้าสู่ระบบ";
  $("aGo").textContent = m === "register" ? "สมัครและเข้าใช้งานเลย" : m === "forgot" ? "ส่งลิงก์ตั้งรหัสผ่านใหม่" : "เข้าสู่ระบบ";
  $("aReg").textContent = m === "login" ? "สมัครสมาชิก" : "← กลับไปเข้าสู่ระบบ";
  $("aForgot").hidden = m !== "login";
}
$("aReg").onclick = () => setMode(mode === "login" ? "register" : "login");
$("aForgot").onclick = () => setMode("forgot");
$("aGo").onclick = async () => {
  const email = $("aEmail").value.trim(), pass = $("aPass").value, msg = $("aMsg");
  msg.className = "msg"; msg.textContent = "";
  if (!email) { msg.textContent = "กรุณากรอกอีเมล"; return; }
  $("aGo").disabled = true;
  try {
    if (mode === "forgot") {
      await sendPasswordResetEmail(auth, email);
      msg.className = "msg ok";
      msg.textContent = "ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว (เช็กกล่องสแปมด้วย)";
    } else if (mode === "register") {
      const name = $("rName").value.trim();
      if (!name) throw { code: "x", message: "กรุณาใส่ชื่อที่แสดง" };
      pendingProfile = { name, province: $("rProv").value, photo: "", bio: "" };
      await createUserWithEmailAndPassword(auth, email, pass);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) { pendingProfile = null; msg.textContent = e.code === "x" ? e.message : errText(e); }
  $("aGo").disabled = false;
};
["aEmail", "aPass"].forEach(i => $(i).onkeydown = e => { if (e.key === "Enter") $("aGo").click(); });

/* ================= สถานะล็อกอิน ================= */
let started = false;
onAuthStateChanged(auth, async u => {
  if (!u) {
    uid = null; $("app").hidden = true; $("auth").hidden = false; setMode("login"); return;
  }
  uid = u.uid;
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const p = pendingProfile || { name: (u.email || "ผู้ใช้").split("@")[0], province: "", photo: "", bio: "" };
    await setDoc(ref, { ...p, lastSeen: Date.now() });
  }
  pendingProfile = null;
  $("auth").hidden = true; $("app").hidden = false;
  if (!started) { started = true; startApp(); }
});

function startApp() {
  onSnapshot(doc(db, "users", uid), s => {
    me = s.data() || {};
    $("tName").textContent = me.name || "";
    $("tAv").replaceChildren(avatar(me.photo, me.name));
  });
  setInterval(() => { if (uid) updateDoc(doc(db, "users", uid), { lastSeen: Date.now() }).catch(() => {}); }, 20000);

  onSnapshot(query(collection(db, "users"), limit(500)), s => {
    usersMap = {}; s.docs.forEach(d => usersMap[d.id] = d.data()); renderUsers();
    if (cur && cur.type === "group") renderInfoIfOpen();
  });
  onSnapshot(query(collection(db, "groups"), where("members", "array-contains", uid)), s => {
    groupsMap = {}; s.docs.forEach(d => groupsMap[d.id] = d.data()); renderGroups();
    renderInfoIfOpen();
  });
  setInterval(() => { renderUsers(); renderTyping(); }, 4000);
}

/* ================= รายการหน้าแรก ================= */
function renderGroups() {
  const box = $("groups"); box.innerHTML = "";
  const ids = Object.keys(groupsMap);
  if (!ids.length) { box.innerHTML = '<div class="item" style="color:#999;cursor:default">ยังไม่มีกลุ่ม กด "+ สร้างกลุ่ม"</div>'; return; }
  ids.sort((a, b) => groupsMap[a].name.localeCompare(groupsMap[b].name, "th")).forEach(id => {
    const g = groupsMap[id], it = document.createElement("div"); it.className = "item";
    it.appendChild(avatar("", "👥"));
    const w = document.createElement("div");
    const n = document.createElement("div"); n.textContent = g.name; w.appendChild(n);
    const s = document.createElement("div"); s.className = "sub";
    s.textContent = g.members.length + " คน" + (g.admin === uid ? " · คุณเป็นผู้ดูแล" : ""); w.appendChild(s);
    it.appendChild(w); it.onclick = () => openChat("group", id, g.name); box.appendChild(it);
  });
}
function renderUsers() {
  const box = $("users"); box.innerHTML = "";
  const list = Object.entries(usersMap).filter(([id]) => id !== uid)
    .sort((a, b) => (a[1].name || "").localeCompare(b[1].name || "", "th"));
  if (!list.length) { box.innerHTML = '<div class="item" style="color:#999;cursor:default">ยังไม่มีสมาชิกคนอื่น</div>'; return; }
  list.forEach(([id, u]) => {
    const it = document.createElement("div"); it.className = "item";
    it.appendChild(avatar(u.photo, u.name));
    const w = document.createElement("div");
    const n = document.createElement("div"); n.textContent = u.name; w.appendChild(n);
    if (u.province) { const s = document.createElement("div"); s.className = "sub"; s.textContent = u.province; w.appendChild(s); }
    it.appendChild(w);
    if (Date.now() - (u.lastSeen || 0) < 60000) { const d = document.createElement("span"); d.className = "dot"; it.appendChild(d); }
    it.onclick = () => openChat("dm", dmId(uid, id), u.name);
    box.appendChild(it);
  });
}

/* ================= เมนูฟันเฟือง ================= */
$("gear").onclick = e => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
document.addEventListener("click", () => { $("menu").hidden = true; });
$("mOut").onclick = async () => {
  if (unsubMsgs) unsubMsgs(); if (unsubTyping) unsubTyping();
  cur = null; $("chat").hidden = true; $("home").hidden = false;
  await signOut(auth);
};

/* ---- บัญชีผู้ใช้ (แก้โปรไฟล์) ---- */
$("mProfile").onclick = () => {
  pickedPhoto = null;
  const m = openModal(`<h3>👤 บัญชีผู้ใช้</h3>
    <img class="pv" id="pPv"><div style="text-align:center"><button class="sm" id="pPick">เปลี่ยนรูปโปรไฟล์</button></div>
    <input class="fld" id="pName" maxlength="30" placeholder="ชื่อที่แสดง">
    <select class="fld" id="pProv"></select>
    <textarea class="fld" id="pBio" rows="3" maxlength="150" placeholder="แนะนำตัวสั้นๆ"></textarea>
    <button class="go" id="pSave">บันทึก</button><button class="alt" id="pClose">ปิด</button><div class="msg" id="pMsg"></div>`);
  provOptions($("pProv"), me.province);
  $("pName").value = me.name || ""; $("pBio").value = me.bio || "";
  const showPv = () => { const p = pickedPhoto !== null ? pickedPhoto : me.photo; $("pPv").src = p || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>"; };
  showPv();
  $("pPick").onclick = () => { fileMode = "avatar"; $("file").click(); };
  window.__pvRefresh = showPv;
  $("pClose").onclick = closeModal;
  $("pSave").onclick = async () => {
    const name = $("pName").value.trim();
    if (!name) { $("pMsg").textContent = "กรุณาใส่ชื่อ"; return; }
    const data = { name, province: $("pProv").value, bio: $("pBio").value.trim() };
    if (pickedPhoto !== null) data.photo = pickedPhoto;
    try { await updateDoc(doc(db, "users", uid), data); closeModal(); }
    catch (e) { $("pMsg").textContent = errText(e); }
  };
};

/* ---- ตั้งค่าบัญชีผู้ใช้ (รีเซ็ต/เปลี่ยนรหัสผ่าน) ---- */
$("mSettings").onclick = () => {
  openModal(`<h3>🔑 ตั้งค่าบัญชีผู้ใช้</h3>
    <div class="sub" style="margin-bottom:8px">อีเมล: <b id="sEmail"></b></div>
    <button class="alt" id="sReset">ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมล</button>
    <div style="margin:14px 0 4px;font-weight:700">หรือเปลี่ยนรหัสผ่านเลย</div>
    <input class="fld" id="sOld" type="password" placeholder="รหัสผ่านเดิม">
    <input class="fld" id="sNew" type="password" placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)">
    <button class="go" id="sChange">เปลี่ยนรหัสผ่าน</button><button class="alt" id="sClose">ปิด</button><div class="msg" id="sMsg"></div>`);
  $("sEmail").textContent = auth.currentUser.email;
  $("sClose").onclick = closeModal;
  $("sReset").onclick = async () => {
    try { await sendPasswordResetEmail(auth, auth.currentUser.email); $("sMsg").className = "msg ok"; $("sMsg").textContent = "ส่งลิงก์ไปที่อีเมลแล้ว"; }
    catch (e) { $("sMsg").className = "msg"; $("sMsg").textContent = errText(e); }
  };
  $("sChange").onclick = async () => {
    try {
      const cred = EmailAuthProvider.credential(auth.currentUser.email, $("sOld").value);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, $("sNew").value);
      $("sMsg").className = "msg ok"; $("sMsg").textContent = "เปลี่ยนรหัสผ่านเรียบร้อย";
      $("sOld").value = $("sNew").value = "";
    } catch (e) { $("sMsg").className = "msg"; $("sMsg").textContent = errText(e); }
  };
};

/* ================= สร้างกลุ่ม / จัดการสมาชิก ================= */
$("newGroup").onclick = () => {
  const m = openModal(`<h3>👥 สร้างกลุ่มใหม่</h3>
    <input class="fld" id="gName" maxlength="40" placeholder="ชื่อกลุ่ม">
    <div class="sub" style="margin:8px 0 2px">เลือกสมาชิกที่จะดึงเข้ากลุ่ม (เพิ่มทีหลังได้)</div><div id="gPick"></div>
    <button class="go" id="gMake">สร้างกลุ่ม</button><button class="alt" id="gClose">ยกเลิก</button><div class="msg" id="gMsg"></div>`);
  const box = $("gPick");
  Object.entries(usersMap).filter(([id]) => id !== uid).forEach(([id, u]) => {
    const r = document.createElement("label"); r.className = "row";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = id;
    r.appendChild(cb); r.appendChild(avatar(u.photo, u.name, 30));
    const n = document.createElement("span"); n.textContent = u.name; r.appendChild(n); box.appendChild(r);
  });
  $("gClose").onclick = closeModal;
  $("gMake").onclick = async () => {
    const name = $("gName").value.trim();
    if (!name) { $("gMsg").textContent = "กรุณาตั้งชื่อกลุ่ม"; return; }
    const members = [uid, ...[...box.querySelectorAll("input:checked")].map(c => c.value)];
    try {
      const r = await addDoc(collection(db, "groups"), { name, admin: uid, members, created: Date.now() });
      closeModal(); openChat("group", r.id, name);
    } catch (e) { $("gMsg").textContent = errText(e); }
  };
};
let infoOpen = false;
$("info").onclick = () => { infoOpen = true; renderInfo(); };
function renderInfoIfOpen() { if (infoOpen && !$("ov").hidden && cur && cur.type === "group") renderInfo(); else infoOpen = false; }
function renderInfo() {
  const g = groupsMap[cur.id]; if (!g) { closeModal(); return; }
  const isAdmin = g.admin === uid;
  openModal(`<h3></h3><div class="sub" id="iSub"></div><div id="iMem"></div>
    <div id="iAddWrap" hidden><div class="sub" style="margin:12px 0 2px;font-weight:700">เพิ่มสมาชิกเข้ากลุ่ม</div><div id="iAdd"></div></div>
    <button class="alt" id="iClose">ปิด</button>`);
  $("md").querySelector("h3").textContent = "👥 " + g.name;
  $("iSub").textContent = "สมาชิก " + g.members.length + " คน";
  g.members.forEach(id => {
    const u = usersMap[id] || { name: "(ไม่ทราบชื่อ)" };
    const r = document.createElement("div"); r.className = "row";
    r.appendChild(avatar(u.photo, u.name, 32));
    const n = document.createElement("div"); n.className = "grow"; n.textContent = u.name;
    if (id === g.admin) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "ผู้ดูแล"; n.appendChild(t); }
    r.appendChild(n);
    if (isAdmin && id !== uid) {
      const b = document.createElement("button"); b.className = "mini red"; b.textContent = "ลบ";
      b.onclick = () => updateDoc(doc(db, "groups", cur.id), { members: arrayRemove(id) });
      r.appendChild(b);
    }
    $("iMem").appendChild(r);
  });
  if (isAdmin) {
    $("iAddWrap").hidden = false;
    const others = Object.entries(usersMap).filter(([id]) => !g.members.includes(id));
    if (!others.length) $("iAdd").innerHTML = '<div class="sub">ทุกคนอยู่ในกลุ่มแล้ว</div>';
    others.forEach(([id, u]) => {
      const r = document.createElement("div"); r.className = "row";
      r.appendChild(avatar(u.photo, u.name, 32));
      const n = document.createElement("div"); n.className = "grow"; n.textContent = u.name; r.appendChild(n);
      const b = document.createElement("button"); b.className = "mini"; b.textContent = "เพิ่ม";
      b.onclick = () => updateDoc(doc(db, "groups", cur.id), { members: arrayUnion(id) });
      r.appendChild(b); $("iAdd").appendChild(r);
    });
  }
  $("iClose").onclick = () => { infoOpen = false; closeModal(); };
}

/* ================= ห้องแชท ================= */
const msgCol = () => collection(db, cur.type === "group" ? "groups" : "dms", cur.id, "messages");
function openChat(type, id, title) {
  cur = { type, id, title, key: type + "_" + id };
  $("home").hidden = true; $("chat").hidden = false;
  $("cTitle").textContent = (type === "group" ? "👥 " : "💬 ") + title;
  $("info").hidden = type !== "group";
  $("msgs").innerHTML = ""; $("typing").textContent = "";
  if (unsubMsgs) unsubMsgs(); if (unsubTyping) unsubTyping();
  unsubMsgs = onSnapshot(query(msgCol(), orderBy("ts"), limitToLast(100)), s => {
    const box = $("msgs"); box.innerHTML = "";
    s.docs.forEach(d => box.appendChild(bubble(d.data())));
    box.scrollTop = box.scrollHeight;
  }, () => {});
  unsubTyping = onSnapshot(query(collection(db, "typing"), where("rid", "==", cur.key)), s => {
    typingCache = s.docs.map(d => d.data()); renderTyping();
  });
}
$("back").onclick = () => {
  if (unsubMsgs) unsubMsgs(); if (unsubTyping) unsubTyping();
  cur = null; $("chat").hidden = true; $("home").hidden = false;
};
function bubble(m) {
  const mine = m.uid === uid, u = usersMap[m.uid] || {};
  const w = document.createElement("div"); w.className = "m" + (mine ? " me" : "");
  w.appendChild(avatar(u.photo, u.name || m.name));
  const b = document.createElement("div"); b.className = "b";
  if (!mine) { const n = document.createElement("div"); n.className = "n"; n.textContent = u.name || m.name; b.appendChild(n); }
  if (m.text) { const t = document.createElement("div"); t.textContent = m.text; b.appendChild(t); }
  if (m.img) {
    const i = document.createElement("img"); i.className = "pic"; i.src = m.img;
    i.onclick = () => { const w2 = window.open(); if (w2) w2.document.write('<img src="' + m.img + '" style="max-width:100%">'); };
    b.appendChild(i);
  }
  w.appendChild(b); return w;
}
async function sendMsg(text, img = "") {
  if (!cur || (!text && !img)) return;
  await addDoc(msgCol(), { uid, text, img, ts: serverTimestamp() });
  deleteDoc(doc(db, "typing", cur.key + "__" + uid)).catch(() => {});
}
$("send").onclick = () => { const t = $("text").value.trim(); if (t) { $("text").value = ""; sendMsg(t.slice(0, 1000)).catch(() => alert("ส่งไม่สำเร็จ")); } };
$("text").onkeydown = e => { if (e.key === "Enter") $("send").click(); };
$("text").oninput = () => {
  if (!cur || Date.now() - lastTyping < 2000) return;
  lastTyping = Date.now();
  setDoc(doc(db, "typing", cur.key + "__" + uid), { rid: cur.key, uid, name: me.name || "", ts: Date.now() }).catch(() => {});
};
function renderTyping() {
  const names = typingCache.filter(t => t.uid !== uid && Date.now() - t.ts < 4000).map(t => t.name);
  $("typing").textContent = names.length ? names.join(", ") + " กำลังพิมพ์..." : "";
}

/* ================= เลือกรูป ================= */
$("imgBtn").onclick = () => { fileMode = "chat"; $("file").click(); };
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    if (fileMode === "avatar") { pickedPhoto = await resize(f, 160, 0.75); if (window.__pvRefresh) window.__pvRefresh(); }
    else await sendMsg("", await resize(f, 800, 0.7));
  } catch (err) { alert("ใช้รูปนี้ไม่ได้"); }
};
</script>
