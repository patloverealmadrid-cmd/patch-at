
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แชทกลุ่มเพื่อน</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #172033;
    }
    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px #00000012;
    }
    h1, h2 { margin-top: 0; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #ccd3df;
    }
    button {
      border: 0;
      background: #246bfd;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button.secondary { background: #526174; }
    button:disabled { opacity: .5; }
    .hidden { display: none; }
    #status {
      white-space: pre-wrap;
      color: #b42318;
      margin: 10px 0;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #e1e6ef;
      border-radius: 10px;
      padding: 10px;
      margin: 12px 0;
      background: #f8fafc;
    }
    .msg {
      background: white;
      border: 1px solid #e5eaf2;
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
    .small {
      font-size: 13px;
      color: #596579;
      overflow-wrap: anywhere;
    }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>💬 แชทกลุ่มเพื่อน</h1>
      <p>สมัครสมาชิกเพื่อเริ่มพูดคุยกับเพื่อน</p>

      <div id="authPanel">
        <input id="email" type="email" placeholder="อีเมล" autocomplete="email">
        <input id="password" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" autocomplete="current-password">
        <div class="row">
          <button id="registerBtn">สมัครสมาชิก</button>
          <button id="loginBtn" class="secondary">เข้าสู่ระบบ</button>
        </div>
      </div>

      <div id="userPanel" class="hidden">
        <p>เข้าสู่ระบบแล้ว</p>
        <p class="small">UID ของคุณ (ส่งให้เพื่อนเพื่อเริ่มแชทส่วนตัว):</p>
        <p id="myUid" class="small"></p>
        <button id="copyUidBtn" class="secondary">คัดลอก UID ของฉัน</button>
        <button id="logoutBtn" class="secondary">ออกจากระบบ</button>
      </div>
      <div id="status"></div>
    </section>

    <section id="chatPanel" class="card hidden">
      <h2>เลือกห้องแชท</h2>
      <button id="groupBtn">👥 ห้องกลุ่มเพื่อน</button>

      <h3>แชทส่วนตัว</h3>
      <p class="small">ใส่ UID ของเพื่อนที่ต้องการคุยด้วย</p>
      <input id="friendUid" placeholder="UID ของเพื่อน">
      <button id="privateBtn">เปิดแชทส่วนตัว</button>

      <hr>
      <h3 id="roomName">ยังไม่ได้เลือกห้อง</h3>
      <div id="messages"></div>
      <form id="sendForm">
        <input id="messageInput" maxlength="2000"
          placeholder="พิมพ์ข้อความ..." autocomplete="off">
        <button id="sendBtn" type="submit">ส่งข้อความ</button>
      </form>
      <p class="small">อย่าส่งรหัสผ่านหรือข้อมูลส่วนตัวที่สำคัญในห้องแชท</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // วางค่าจาก Firebase Web App ของพี่แพ็ทไว้ตรงนี้
    const firebaseConfig = {
  apiKey: "AIzaSyAdEhQTgHQtCaat5dPKBAizgNYpoxm4dco",
  authDomain: "patch-at.firebaseapp.com",
  projectId: "patch-at",
  storageBucket: "patch-at.firebasestorage.app",
  messagingSenderId: "201035067162",
  appId: "1:201035067162:web:021d18b8f574bcbe8cc6a3"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const $ = id => document.getElementById(id);
    let currentRoom = null;
    let currentRoomLabel = "";
    let unsubscribeMessages = null;

    function status(message) {
      $("status").textContent = message || "";
    }

    function showLoggedIn(user) {
      $("authPanel").classList.toggle("hidden", !!user);
      $("userPanel").classList.toggle("hidden", !user);
      $("chatPanel").classList.toggle("hidden", !user);
      $("myUid").textContent = user ? user.uid : "";
      if (!user) {
        currentRoom = null;
        currentRoomLabel = "";
        $("roomName").textContent = "ยังไม่ได้เลือกห้อง";
        $("messages").replaceChildren();
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = null;
      }
    }

    $("registerBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || password.length < 6) {
        status("กรุณาใส่อีเมลและรหัสผ่านอย่างน้อย 6 ตัว");
        return;
      }
      try {
        await auth.createUserWithEmailAndPassword(email, password);
        status("สมัครสมาชิกสำเร็จ");
      } catch (e) {
        status("สมัครไม่สำเร็จ: " + e.message);
      }
    });

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        status("เข้าสู่ระบบสำเร็จ");
      } catch (e) {
        status("เข้าสู่ระบบไม่สำเร็จ: " + e.message);
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await auth.signOut();
        status("ออกจากระบบแล้ว");
      } catch (e) {
        status("ออกจากระบบไม่สำเร็จ: " + e.message);
      }
    });

    $("copyUidBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(auth.currentUser.uid);
        status("คัดลอก UID แล้ว ส่งให้เพื่อนได้เลย");
      } catch (e) {
        status("คัดลอกอัตโนมัติไม่ได้ กรุณาเลือกและคัดลอก UID ด้วยตนเอง");
      }
    });

    async function openRoom(roomId, label) {
      const user = auth.currentUser;
      if (!user) return;

      try {
        if (roomId !== "general") {
          const ids = roomId.split("_");
          if (ids.length !== 2 || !ids.includes(user.uid)) {
            throw new Error("ห้องนี้ไม่ใช่ห้องส่วนตัวของคุณ");
          }

          const roomRef = db.collection("rooms").doc(roomId);
          const roomSnap = await roomRef.get();

          if (!roomSnap.exists) {
            await roomRef.set({
              members: ids,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else if (
            !Array.isArray(roomSnap.data().members) ||
            !roomSnap.data().members.includes(user.uid)
          ) {
            throw new Error("คุณไม่มีสิทธิ์เข้าห้องนี้");
          }
        }

        currentRoom = roomId;
        currentRoomLabel = label;
        $("roomName").textContent = "ห้อง: " + label;
        $("messages").replaceChildren();

        if (unsubscribeMessages) unsubscribeMessages();

        unsubscribeMessages = db.collection("rooms")
          .doc(roomId).collection("messages")
          .orderBy("createdAt")
          .limit(100)
          .onSnapshot(snapshot => {
            $("messages").replaceChildren();

            snapshot.forEach(doc => {
              const data = doc.data();
              const item = document.createElement("div");
              item.className = "msg";

              const who = document.createElement("strong");
              who.textContent = data.senderId === user.uid
                ? "คุณ"
                : "เพื่อน";

              const body = document.createElement("div");
              body.textContent = data.text || "";

              const time = document.createElement("div");
              time.className = "small";
              time.textContent = data.createdAt &&
                data.createdAt.toDate
                ? data.createdAt.toDate().toLocaleString("th-TH")
                : "กำลังส่ง...";

              item.append(who, body, time);
              $("messages").appendChild(item);
            });

            $("messages").scrollTop = $("messages").scrollHeight;
          }, e => status("อ่านข้อความไม่ได้: " + e.message));

        status("เปิดห้องแชทแล้ว");
      } catch (e) {
        status("เปิดห้องไม่ได้: " + e.message);
      }
    }

    $("groupBtn").addEventListener("click", () => {
      openRoom("general", "กลุ่มเพื่อน");
    });

    $("privateBtn").addEventListener("click", () => {
      const user = auth.currentUser;
      const friendUid = $("friendUid").value.trim();

      if (!user) return status("กรุณาเข้าสู่ระบบก่อน");
      if (!friendUid) return status("กรุณาใส่ UID ของเพื่อน");
      if (friendUid === user.uid) return status("นี่คือ UID ของคุณเอง");

      const roomId = [user.uid, friendUid].sort().join("_");
      openRoom(roomId, "แชทส่วนตัว");
    });

    $("sendForm").addEventListener("submit", async event => {
      event.preventDefault();

      const user = auth.currentUser;
      const message = $("messageInput").value.trim();

      if (!user) return status("กรุณาเข้าสู่ระบบก่อน");
      if (!currentRoom) return status("กรุณาเลือกห้องแชทก่อน");
      if (!message) return;

      $("sendBtn").disabled = true;
      try {
        await db.collection("rooms").doc(currentRoom)
          .collection("messages").add({
            senderId: user.uid,
            text: message,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

        $("messageInput").value = "";
        status("ส่งข้อความแล้ว");
      } catch (e) {
        status("ส่งข้อความไม่ได้: " + e.message);
      } finally {
        $("sendBtn").disabled = false;
      }
    });

    auth.onAuthStateChanged(user => {
      showLoggedIn(user);
      if (user) status("พร้อมใช้งาน เลือกห้องแชทได้เลย");
    });
  </script>
</body>
</html>
